name: Deploy staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm type-check

      - name: API tests
        run: pnpm --filter api test

      - name: Build
        run: pnpm build

  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.DEPLOY_FRONTEND_FROM_GITHUB_ACTIONS == 'true' }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        working-directory: apps/web
        run: pnpm dlx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel project
        working-directory: apps/web
        run: pnpm dlx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel project
        working-directory: apps/web
        run: pnpm dlx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  deploy-backend:
    name: Trigger backend deploy
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.DEPLOY_BACKEND_FROM_GITHUB_ACTIONS == 'true' }}

    steps:
      - name: Trigger backend deploy hook
        run: curl -fsS -X POST "${{ secrets.BACKEND_DEPLOY_HOOK_URL }}"

  deployment-notes:
    name: Deployment notes
    runs-on: ubuntu-latest
    needs:
      - validate
    if: always()

    steps:
      - name: Print notes
        run: |
          echo "Validation status: ${{ needs.validate.result }}"
          echo "Frontend deployment is usually handled by Vercel GitHub Integration."
          echo "Backend deployment is usually handled by the backend provider auto-deploy or deploy hook."
          echo "Database migrations are not automated yet because the repo currently stores raw SQL files without a migration runner script."
